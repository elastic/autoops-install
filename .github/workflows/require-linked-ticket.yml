# Fails the pull request when it does not close a GitHub issue.
# Add this job as a required status check on the default branch so merge is blocked.
# The workflow runs from the default branch (pull_request_target) so a pull request
# cannot edit the check to make itself pass.

name: Require linked ticket

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: require-linked-ticket-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-linked-ticket:
    name: require-linked-ticket
    runs-on: ubuntu-latest
    steps:
      - name: Require a linked ticket
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const head = context.payload.pull_request.head.ref;
            const exempt = [
              /^renovate\//,
              /^dependabot\//,
              /^changelog-bot\//,
              /^release-notes-bot\//,
            ];
            if (exempt.some((pattern) => pattern.test(head))) {
              core.info(`Automated branch ${head} does not need a linked ticket.`);
              return;
            }

            const query = `
              query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    closingIssuesReferences(first: 20) {
                      nodes { number title }
                    }
                  }
                }
              }
            `;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              name: context.repo.repo,
              number: context.payload.pull_request.number,
            });
            const issues = result.repository.pullRequest.closingIssuesReferences.nodes;
            if (issues.length === 0) {
              core.setFailed(
                "This pull request is not linked to a ticket, so it cannot merge. " +
                  "Link an issue from the Development sidebar, or add a closing keyword " +
                  "such as \"Closes #123\" to the description."
              );
              return;
            }
            const linked = issues.map((issue) => `#${issue.number}`).join(", ");
            core.info(`Linked tickets: ${linked}`);
